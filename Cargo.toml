[package]
name = "tree-ometry"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version = "2.1.1", features = [
    "debug",
    "display",
    "from",
    "into",
] }
lending-iterator = "0.1.7"
paste = "1.0.15"
ref-cast = "1.0.25"
serde = { version = "1.0.228", optional = true, features = ["derive"] }
slotmap = "1.1.1"
thiserror = "2.0.17"

[dev-dependencies]
rand = "0.9.2"
serde_json = "1.0.149"

[features]
serde = ["dep:serde"]
